name: MyProd
services:
  vector-db:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  redis:
    image: redis:latest
    container_name: redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    hostname: redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=LocalRedis:redis:6379:0
    depends_on:
      - redis

volumes:
  redis_data: